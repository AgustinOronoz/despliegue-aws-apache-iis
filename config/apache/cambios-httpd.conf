# Cambios aplicados sobre la configuración por defecto de Apache 2.4.66 (Apache Lounge, Win64)
# Instalado en C:\Apache24 como servicio de Windows:  cd C:\Apache24\bin  &&  httpd.exe -k install
# Fragmentos, no el archivo completo.

# ---------- conf/httpd.conf ----------

# Puerto del sitio pedido por la letra
Listen 8085
# Puerto 80 habilitado solo para la verificación HTTP de ZeroSSL (File Upload)
Listen 80

# Habilitar SSL/TLS (líneas descomentadas)
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
Include conf/extra/httpd-ssl.conf

# ---------- conf/extra/httpd-ssl.conf ----------
# Certificado gratuito de 90 días emitido por ZeroSSL para el dominio del sitio
SSLCertificateFile      "${SRVROOT}/conf/server.crt"
SSLCertificateKeyFile   "${SRVROOT}/conf/server.key"
SSLCertificateChainFile "${SRVROOT}/conf/ca_bundle.crt"

# Validación antes de reiniciar el servicio:
#   C:\Apache24\bin> httpd.exe -t      ->  Syntax OK
